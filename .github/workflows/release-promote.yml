name: Promote (npm)

# Moves one npm dist-tag to one released version, for every release package.
#
# Promotion runs here rather than on a maintainer's machine so that it uses the
# same npm Trusted Publishing identity that published the release. That removes
# the local npm token, the two-factor prompt, and the operation lease the local
# path needed to make one maintainer's laptop safe to write from.
#
# Mutual exclusion is the concurrency group below. One repository, one promotion
# at a time.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote, without a leading v (for example 0.2.1).
        required: true
        type: string
      tag:
        description: Destination dist-tag.
        required: true
        type: choice
        options:
          - latest
          - stable
          - beta

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Trusted Publishing trusts this workflow for the release packages, and the
    # environment carries the maintainer review.
    environment: publish
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Move the dist-tag for every release package
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          packages="$(node --import tsx --input-type=module -e '
            import {
              RELEASE_LAUNCHER_PACKAGE,
              PUBLISHED_PLATFORM_PACKAGES
            } from "./shared/release-targets.ts";
            process.stdout.write(
              [...PUBLISHED_PLATFORM_PACKAGES, RELEASE_LAUNCHER_PACKAGE].join("\n")
            );
          ')"
          # Platform packages move before the launcher, so the launcher never
          # names a version whose platform packages the tag does not yet reach.
          printf '%s\n' "$packages" | while read -r name; do
            test -n "$name" || continue
            echo "::group::$name"
            npm dist-tag add "$name@$VERSION" "$TAG"
            npm dist-tag ls "$name"
            echo "::endgroup::"
          done

      - name: Make the GitHub release current
        if: inputs.tag == 'latest' || inputs.tag == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest
