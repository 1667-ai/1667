name: CI

# Public repositories get unlimited standard-runner minutes, so the allowance
# that ran out no longer applies. Timeouts still stop wedged jobs. The serial
# gate needs 25 minutes for the runtime, TUI, standalone, and filesystem lanes.
# Packaged-platform jobs keep the 15-minute limit, except darwin-x64: on
# macos-15-intel its successful runs already measure close to 15 minutes, so
# the cap itself became the flake.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Resolve prompt compatibility base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PULL_REQUEST_BASE}"
          elif [[ "${EVENT_NAME}" == "push" && -n "${PUSH_BEFORE}" \
            && "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE}"
            if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Push base is not a full lowercase commit SHA." >&2
              exit 1
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${base}" || {
                echo "Push base commit is unavailable from origin." >&2
                exit 1
              }
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "Fetched push base is not a commit." >&2
                exit 1
              fi
            fi
          else
            git fetch --no-tags origin "${DEFAULT_BRANCH}"
            base="$(git merge-base HEAD "origin/${DEFAULT_BRANCH}")"
          fi
          test -n "${base}"
          echo "PROMPT_COMPATIBILITY_BASE=${base}" >> "${GITHUB_ENV}"

      - name: Check prompt compatibility evidence
        run: npm run prompt:check -- --base "${PROMPT_COMPATIBILITY_BASE}"

      - name: Build runtime
        run: npm run build

      - name: Test runtime
        run: npm test

      - name: Type-check TUI
        working-directory: tui
        run: bun run typecheck

      - name: Test TUI
        working-directory: tui
        run: bun run test

      - name: Build and smoke-test native standalone
        working-directory: tui
        run: bun run build:standalone

      - name: Install Btrfs tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs

      - name: Test packaged Btrfs identity
        run: |
          set -euo pipefail
          image="${RUNNER_TEMP}/1667-btrfs-source.img"
          clone_image="${RUNNER_TEMP}/1667-btrfs-clone.img"
          mount_point="${RUNNER_TEMP}/1667-btrfs"
          state="${RUNNER_TEMP}/1667-btrfs-state"
          first="${RUNNER_TEMP}/1667-btrfs-first.json"
          snapshot="${RUNNER_TEMP}/1667-btrfs-snapshot.json"
          clone="${RUNNER_TEMP}/1667-btrfs-clone.json"
          truncate --size 512M "${image}"
          mkfs.btrfs --force --quiet "${image}"
          mkdir --parents "${mount_point}"
          sudo mount --options loop "${image}" "${mount_point}"
          cleanup() {
            sudo umount "${mount_point}" || true
          }
          trap cleanup EXIT
          sudo chown "$(id --user):$(id --group)" "${mount_point}"
          btrfs subvolume create "${mount_point}/project"
          AI_1667_BTRFS_TEST_ROOT="${mount_point}/node-identity" \
          AI_1667_BTRFS_TEST_MOUNT="${mount_point}" \
            node --import tsx --test \
              test/http-btrfs-node-integration.test.ts
          bun tui/scripts/standalone-btrfs-identity.ts capture \
            tui/dist/1667 "${mount_point}/project" "${state}" "${first}"
          btrfs subvolume snapshot \
            "${mount_point}/project" "${mount_point}/snapshot"
          bun tui/scripts/standalone-btrfs-identity.ts capture \
            tui/dist/1667 "${mount_point}/snapshot" "${state}" "${snapshot}"
          sudo umount "${mount_point}"
          cp --reflink=never "${image}" "${clone_image}"
          sudo mount --options loop "${clone_image}" "${mount_point}"
          bun tui/scripts/standalone-btrfs-identity.ts capture \
            tui/dist/1667 "${mount_point}/project" "${state}" "${clone}"
          bun tui/scripts/standalone-btrfs-identity.ts verify \
            "${first}" "${snapshot}" "${clone}"

      - name: Test non-Btrfs clone rejection
        run: |
          set -euo pipefail
          source_image="${RUNNER_TEMP}/1667-ext4-source.img"
          clone_image="${RUNNER_TEMP}/1667-ext4-clone.img"
          mount_point="${RUNNER_TEMP}/1667-ext4"
          machine="${RUNNER_TEMP}/1667-ext4-machine"
          record="${RUNNER_TEMP}/1667-ext4-claim.json"
          loop_device=""
          cleanup() {
            sudo umount "${mount_point}" 2>/dev/null || true
            if [[ -n "${loop_device}" ]]; then
              sudo losetup --detach "${loop_device}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          truncate --size 128M "${source_image}"
          mkfs.ext4 -F -q "${source_image}"
          mkdir --parents "${mount_point}"
          loop_device="$(sudo losetup --find --show "${source_image}")"
          sudo mount "${loop_device}" "${mount_point}"
          sudo chown "$(id --user):$(id --group)" "${mount_point}"
          mkdir "${mount_point}/project"
          AI_1667_NON_BTRFS_TEST_ROOT="${mount_point}/project" \
          AI_1667_NON_BTRFS_TEST_MACHINE="${machine}" \
          AI_1667_NON_BTRFS_TEST_RECORD="${record}" \
          AI_1667_NON_BTRFS_TEST_MODE=capture \
            node --import tsx --test \
              test/http-non-btrfs-claim-integration.test.ts
          sudo umount "${mount_point}"
          sudo losetup --detach "${loop_device}"
          cp --reflink=never "${source_image}" "${clone_image}"
          sudo losetup "${loop_device}" "${clone_image}"
          sudo mount "${loop_device}" "${mount_point}"
          AI_1667_NON_BTRFS_TEST_ROOT="${mount_point}/project" \
          AI_1667_NON_BTRFS_TEST_MACHINE="${machine}" \
          AI_1667_NON_BTRFS_TEST_RECORD="${record}" \
          AI_1667_NON_BTRFS_TEST_MODE=verify \
            node --import tsx --test \
              test/http-non-btrfs-claim-integration.test.ts

  # The packaged-platform matrix covers all five release targets on pull
  # requests, pushes to main, and manual runs. darwin-x64 is the slowest target
  # here by roughly ten times (6m13s against 2m14s for its arm64 sibling on the
  # same commit) on macos-15-intel, so it has a 25-minute timeout. Windows runs
  # native contracts and the packaged product. The full runtime and TUI suites
  # have POSIX-only fixtures, so the Linux gate runs them.
  packaged-platform:
    name: packaged-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ["darwin-arm64", "darwin-x64", "linux-arm64", "linux-x64", "windows-x64"]
    runs-on: ${{ fromJSON('{"darwin-arm64":"macos-15","darwin-x64":"macos-15-intel","linux-arm64":"ubuntu-24.04-arm","linux-x64":"ubuntu-24.04","windows-x64":"windows-2025"}')[matrix.target] }}
    timeout-minutes: ${{ matrix.target == 'darwin-x64' && 25 || 15 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run native platform tests
        if: matrix.target != 'darwin-x64' && matrix.target != 'windows-x64'
        run: npm test

      - name: Run Windows platform, installer, and image tests
        if: matrix.target == 'windows-x64'
        run: >-
          node --import tsx --import ./test/setup.ts --test
          test/windows-platform-contract.test.ts
          test/windows-platform-acl-edge-cases.test.ts
          test/release-install-script.test.ts
          test/release-install-powershell.test.ts
          test/image-normalize.test.ts

      - name: Run Intel macOS platform tests without benchmark contention
        if: matrix.target == 'darwin-x64'
        run: npm test -- --test-concurrency=1

      - name: Run sharded TUI tests
        if: matrix.target != 'darwin-x64' && matrix.target != 'windows-x64'
        working-directory: tui
        run: bun run test

      - name: Run Windows upgrade, ownership, and clipboard tests
        if: matrix.target == 'windows-x64'
        working-directory: tui
        run: >-
          bun test --timeout 30000
          test/upgrade-cli.test.ts
          test/windows-powershell-upgrade.test.ts
          test/windows-powershell-upgrade-recovery.test.ts
          test/windows-powershell-upgrade-compat.test.ts
          test/install-ownership-authority.test.ts
          test/clipboard-command-runner.test.ts
          test/clipboard-windows.test.ts

      - name: Run Intel macOS TUI tests without filesystem contention
        if: matrix.target == 'darwin-x64'
        working-directory: tui
        run: bun run test -- --max-concurrency=1

      - name: Build and execute packaged candidate
        working-directory: tui
        env:
          AI_1667_WINDOWS_DEFAULT_STATE_SMOKE: ${{ matrix.target == 'windows-x64' && '1' || '0' }}
        run: bun run build:standalone
