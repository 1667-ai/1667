name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Build runtime
        run: npm run build

      - name: Test runtime
        run: npm test

      - name: Type-check TUI
        working-directory: tui
        run: bun run typecheck

      - name: Test TUI
        working-directory: tui
        run: bun test

      - name: Build and smoke-test native standalone
        working-directory: tui
        run: bun run build:standalone

  packaged-platform:
    name: packaged-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run native platform tests
        if: matrix.target != 'windows-x64'
        run: npm test

      - name: Run native TUI tests
        if: matrix.target != 'windows-x64'
        working-directory: tui
        run: bun test

      - name: Check Windows fail-closed platform boundaries
        if: matrix.target == 'windows-x64'
        run: node --import tsx --test test/windows-platform-contract.test.ts

      - name: Type-check Windows candidate
        if: matrix.target == 'windows-x64'
        run: npm run typecheck

      - name: Type-check Windows TUI
        if: matrix.target == 'windows-x64'
        working-directory: tui
        run: bun run typecheck

      - name: Build and execute packaged candidate
        working-directory: tui
        run: bun run build:standalone
