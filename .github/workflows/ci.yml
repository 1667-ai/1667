name: CI

# Public repositories get unlimited standard-runner minutes, so the allowance
# that ran out no longer applies. The 15-minute timeouts stay: the spend that
# exhausted it was 61% wedged jobs riding a 30-35 minute limit, and nothing
# healthy here takes longer than four minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Build runtime
        run: npm run build

      - name: Test runtime
        run: npm test

      - name: Type-check TUI
        working-directory: tui
        run: bun run typecheck

      - name: Test TUI
        working-directory: tui
        run: bun test

      - name: Build and smoke-test native standalone
        working-directory: tui
        run: bun run build:standalone

  # Routine CI does not build darwin-x64 or windows-x64. Add each target again
  # when its release work resumes.
  packaged-platform:
    name: packaged-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Run native platform tests
        run: npm test

      - name: Run native TUI tests
        working-directory: tui
        run: bun test

      - name: Build and execute packaged candidate
        working-directory: tui
        run: bun run build:standalone
