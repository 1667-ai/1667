name: Release (GitHub)

# Publishes one archive per published release target as a GitHub pre-release,
# with a build-provenance attestation over every uploaded file. Manual dispatch
# only: a release is a decision, not a consequence of a push. That is still
# true of a versioned release. The schedule publishes only to the one mutable
# Nightly Release, which no version number and no tag of its own is spent on.
#
# The target list, the archive contents, the archive names, the checksum file,
# and the release notes all come from scripts/release-github-assets.ts and the
# modules beside it, because a file list written in YAML cannot be tested and
# the file this must never drop is LICENSE.
on:
  schedule:
    # 04:27 UTC. A run with no new commit stops in prepare.
    - cron: '27 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, without a leading v (for example 0.1.0-rc.1). It
          must include a prerelease identifier. It must match the version in
          package.json, tui/package.json, and the lockfile; the command that
          checks the release source refuses it otherwise. An empty value builds
          a nightly, and a supplied value builds that version.
        required: false
        type: string

permissions:
  contents: read

# Windows runners default to PowerShell. A target that leaves the publication
# hold must not need a rewrite of every step here to build.
defaults:
  run:
    shell: bash

concurrency:
  group: release-github-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Short strings, and deliberately nothing larger, cross job boundaries here.
    # The version, commit, and timestamp facts carry the build identity, and
    # the target list, nightly flag, and proceed decision steer downstream jobs.
    outputs:
      targets: ${{ steps.policy.outputs.targets }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.facts.outputs.commit }}
      timestamp: ${{ steps.facts.outputs.timestamp }}
      nightly: ${{ steps.source.outputs.nightly }}
      proceed: ${{ steps.decision.outputs.proceed }}
    steps:
      # Fail closed. A job-level `if` would skip and report success, which for a
      # release job is indistinguishable from a release that happened.
      - name: Refuse to release from anywhere but the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Release dispatch must use refs/heads/$DEFAULT_BRANCH, not $REF"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      # Every build identity in this run records a clean tree, so prove it
      # before any of them is built.
      - name: Refuse a dirty working tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]; then
            echo "::error::The release checkout is not clean"
            exit 1
          fi

      # This job runs two pure-JavaScript commands through tsx and compiles
      # nothing, so it has no use for a dependency's install script. See the
      # release job for why a release path installs without them.
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Resolve the published targets
        id: policy
        run: |
          set -euo pipefail
          targets="$(node --import tsx scripts/release-github-assets.ts targets)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Publishing $targets" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute commit and timestamp facts
        id: facts
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          timestamp="$(node -e 'process.stdout.write(new Date().toISOString())')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"

      - name: Decide whether to proceed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.facts.outputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)"
          decision="$(node --import tsx scripts/release-nightly.ts decide "$COMMIT" "$previous")"
          if [ "$decision" = "build" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            reason="${decision#skip }"
            echo "Skipping nightly release: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      # One timestamp and one commit for every target, so the archives describe
      # one build rather than one build per runner, minutes apart. The check
      # rejects a version the release identity codec would reject, and one the
      # repository's own package versions disagree with, here rather than on
      # four runners at once.
      #
      # The version, the commit and the timestamp are all the release identity
      # that crosses a job boundary. Each later job rebuilds its release
      # identity in memory from them. The other two outputs are decisions, not
      # identity: `nightly` names the publication path and `proceed` says
      # whether this run publishes at all. Do not "simplify"
      # that into building the identity once, writing it to a file and uploading
      # the file for the matrix to download. The evidence document the identity
      # codec parses types tagObjectType as "annotated" and tagSignature as
      # "verified" — literals, so every copy asserts a verified signed tag.
      # Nothing here verifies a signature, and at this moment the tag does not
      # exist: the release job creates it last. scripts/release-preflight.ts
      # accepts exactly that document as its signed-tag evidence, and that is
      # the gate in front of npm publication, which cannot be withdrawn. An
      # uploaded artifact would therefore be a downloadable, ready-made
      # credential for that gate. Three strings assert nothing, so they may be
      # passed; the document they build may not.
      #
      # An empty inputs.version resolves to a nightly version generated from the
      # commit and timestamp. A supplied inputs.version is used as it is.
      - name: Check the release source and publish its facts
        id: source
        if: steps.decision.outputs.proceed == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.facts.outputs.commit }}
          TIMESTAMP: ${{ steps.facts.outputs.timestamp }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_VERSION" ]; then
            version="$(node --import tsx scripts/release-nightly.ts version "$COMMIT" "$TIMESTAMP")"
            nightly="true"
          else
            version="$INPUT_VERSION"
            nightly="false"
          fi
          node --import tsx scripts/release-github-assets.ts check \
            "$version" "$COMMIT" "$TIMESTAMP"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # A skipped run publishes nothing. This is the one place a job-level `if`
    # is right, because the decision is deliberate rather than a failure.
    if: needs.prepare.outputs.proceed == 'true'
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    # Every target this repository builds, held or not. The publication decision
    # is the heldFromPublication field in shared/release-targets.ts, and it
    # reaches the matrix above through the targets command.
    runs-on: ${{ fromJSON('{"darwin-arm64":"macos-15","darwin-x64":"macos-15-intel","linux-arm64":"ubuntu-24.04-arm","linux-x64":"ubuntu-24.04","windows-x64":"windows-2025"}')[matrix.target] }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # This job compiles the executable, so the prebuilt native dependency it
      # embeds has to be installed the way it is installed everywhere else,
      # install script and all. It is also the one job in this workflow that
      # holds no permission beyond the read the checkout needs: it mints no
      # token, signs nothing, and writes nothing outside its own artifact.
      - name: Install runtime dependencies
        run: npm ci

      # matrix.target is bound to a machine by nothing but the runner label map
      # above, and GitHub repoints labels: macos-15-intel is a retiring class,
      # and macos-13/macos-14 changed default architecture during their lives.
      # A repointed label would compile an arm64 executable, stamp
      # `darwin-x64` into its build-manifest.json — the identity is supplied
      # here rather than derived from the host, so nothing downstream disagrees
      # — and the release job would attest exactly those bytes. Prove the
      # machine is the target before anything is compiled, and fail if it is
      # not.
      - name: Refuse a runner that is not the matrix target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node --import tsx scripts/release-github-assets.ts runner "$TARGET"

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      # The compiled executable reports this identity from `--version --json`,
      # and the build refuses to finish if the executable disagrees with it.
      # The identity is built here, in this job, from the three strings prepare
      # published; nothing is downloaded, because there is nothing to download.
      - name: Pin the build identity
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          identity="$(node --import tsx scripts/release-github-assets.ts identity \
            "$VERSION" "$COMMIT" "$TIMESTAMP" "$TARGET")"
          printf 'AI_1667_BUILD_IDENTITY_JSON=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Build and smoke-test the executable
        working-directory: tui
        run: bun run build:standalone

      # The command writes every file the archive must hold, refuses to stage an
      # archive missing LICENSE or NOTICE, verifies both against their reviewed
      # digests, refuses a directory holding anything else, and prints the
      # archive name. The same three strings again, so every target in this run
      # stamps one identity into its build-manifest.json.
      - name: Assemble and pack the archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/archives
          stem="$(node --import tsx scripts/release-github-assets.ts stage \
            "$VERSION" "$COMMIT" "$TIMESTAMP" "$TARGET" tui/dist dist/stage)"
          # POSIX ustar only: Shell Installer validates the physical stream and
          # refuses PAX/GNU extension headers that default tar formats emit.
          # COPYFILE_DISABLE keeps macOS metadata from adding physical entries.
          COPYFILE_DISABLE=1 tar --format=ustar -czf "dist/archives/$stem.tar.gz" -C dist/stage "$stem"
          tar -tzf "dist/archives/$stem.tar.gz"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: dist/archives/*.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    # A skipped run publishes nothing. This is the one place a job-level `if`
    # is right, because the decision is deliberate rather than a failure.
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Only this job signs anything or writes anything: id-token and
      # attestations mint the provenance, contents creates the release.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      # No install scripts here, and the reason is this job's permissions. A
      # postinstall script from any package in the tree — three declare one —
      # would run as this job, with ACTIONS_ID_TOKEN_REQUEST_TOKEN and
      # ACTIONS_ID_TOKEN_REQUEST_URL in its environment, and could mint an
      # OIDC token and attest bytes this workflow never built under this
      # repository's name. That attestation is the only evidence this release
      # path offers, and the notes tell readers to verify with it. npm is here
      # so tsx can run two pure-JavaScript commands, `checksums` and `notes`,
      # neither of which loads a native module; nothing in this job compiles.
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts

      - name: Download every archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist/assets

      - name: Check that every published target arrived
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$TARGETS" | jq 'length')"
          found="$(find dist/assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')"
          if [ "$found" != "$expected" ]; then
            echo "::error::Expected $expected archives, found $found"
            exit 1
          fi

      # Render the Installers from the same archive digests. This path
      # publishes a prerelease SemVer, so stable Installers are absent.
      - name: Render the Installers
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          digests="$(
            node --import tsx --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readdirSync, readFileSync } from "node:fs";
              const dir = "dist/assets";
              const out = {};
              for (const name of readdirSync(dir)) {
                if (!name.endsWith(".tar.gz")) continue;
                out[name] = createHash("sha256").update(readFileSync(dir + "/" + name)).digest("hex");
              }
              process.stdout.write(JSON.stringify(out));
            '
          )"
          node --import tsx scripts/release-install-script.ts render \
            "$VERSION" "$GITHUB_REPOSITORY" "$digests" dist/assets
          # Ask policy which Installers this version produces. A held target
          # empties its kind, and naming the files here would then demand an
          # asset the renderer intentionally did not write.
          expected="$(
            node --import tsx --input-type=module -e '
              import { expectedInstallerNames } from "./scripts/release-publication-assets.ts";
              process.stdout.write(expectedInstallerNames(process.argv[1]).join("\n"));
            ' "$VERSION"
          )"
          printf '%s\n' "$expected" | while read -r name; do
            test -n "$name" || continue
            test -f "dist/assets/$name"
          done
          test ! -e dist/assets/install-stable.sh
          test ! -e dist/assets/install-stable.ps1

      # The redirection creates checksums.txt before the command reads the
      # directory, which is why the command never lists a file by that name.
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          node --import tsx scripts/release-github-assets.ts checksums dist/assets \
            > dist/assets/checksums.txt
          cat dist/assets/checksums.txt

      - name: Attest every uploaded file
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/assets/*.tar.gz
            dist/assets/install-*
            dist/assets/checksums.txt

      - name: Publish the pre-release
        if: needs.prepare.outputs.nightly != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          node --import tsx scripts/release-github-assets.ts notes "$VERSION" > dist/release-notes.md
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --prerelease \
            --title "1667 v$VERSION" \
            --notes-file dist/release-notes.md \
            dist/assets/*.tar.gz \
            dist/assets/install-* \
            dist/assets/checksums.txt

      # Move the tag ref first so the release, tag, and assets all name one commit.
      # Assets are deleted before uploading new ones because an archive name
      # carries the version, so a new run writes new names; without deleting
      # previous assets, the Nightly Release would grow without bound.
      - name: Publish the Nightly Release
        if: needs.prepare.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          node --import tsx scripts/release-github-assets.ts notes "$VERSION" > dist/release-notes.md
          if gh release view nightly --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$COMMIT" -F force=true > /dev/null
            gh release edit nightly --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "1667 nightly $VERSION" \
              --notes-file dist/release-notes.md
            gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' > dist/previous-assets.txt
            while read -r name; do
              [ -n "$name" ] || continue
              gh release delete-asset nightly "$name" --repo "$GITHUB_REPOSITORY" --yes
            done < dist/previous-assets.txt
            gh release upload nightly --repo "$GITHUB_REPOSITORY" \
              dist/assets/*.tar.gz \
              dist/assets/install-nightly.* \
              dist/assets/checksums.txt
          else
            gh release create nightly --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --prerelease \
              --title "1667 nightly $VERSION" \
              --notes-file dist/release-notes.md \
              dist/assets/*.tar.gz \
              dist/assets/install-nightly.* \
              dist/assets/checksums.txt
          fi
