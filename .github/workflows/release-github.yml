name: Release (GitHub)

# Publishes one archive per published release target as a GitHub pre-release,
# with a build-provenance attestation over every uploaded file. Manual dispatch
# only: a release is a decision, not a consequence of a push.
#
# The target list, the archive contents, the archive names, the checksum file,
# and the release notes all come from scripts/release-github-assets.ts and the
# modules beside it, because a file list written in YAML cannot be tested and
# the file this must never drop is LICENSE.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, without a leading v (for example 0.1.0-rc.1). It
          must match the version in package.json, tui/package.json, and the
          lockfile; the command that records the evidence refuses it otherwise.
        required: true
        type: string

permissions:
  contents: read

# Windows runners default to PowerShell. A target that leaves the publication
# hold must not need a rewrite of every step here to build.
defaults:
  run:
    shell: bash

concurrency:
  group: release-github-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      targets: ${{ steps.policy.outputs.targets }}
      version: ${{ steps.evidence.outputs.version }}
      commit: ${{ steps.evidence.outputs.commit }}
    steps:
      # Fail closed. A job-level `if` would skip and report success, which for a
      # release job is indistinguishable from a release that happened.
      - name: Refuse to release from anywhere but the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Release dispatch must use refs/heads/$DEFAULT_BRANCH, not $REF"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      # The evidence records a clean tree, so prove it before recording it.
      - name: Refuse a dirty working tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]; then
            echo "::error::The release checkout is not clean"
            exit 1
          fi

      - name: Install runtime dependencies
        run: npm ci

      - name: Resolve the published targets
        id: policy
        run: |
          set -euo pipefail
          targets="$(node --import tsx scripts/release-github-assets.ts targets)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Publishing $targets" >> "$GITHUB_STEP_SUMMARY"

      # One timestamp and one commit for every target, so the archives describe
      # one build rather than one build per runner, minutes apart. The
      # command rejects a version the release identity codec would reject, and
      # rejects one the repository's own package versions disagree with.
      - name: Record the release source evidence
        id: evidence
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          timestamp="$(node -e 'process.stdout.write(new Date().toISOString())')"
          node --import tsx scripts/release-github-assets.ts evidence \
            "$VERSION" "$commit" "$timestamp" > release-source-evidence.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Upload the release source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-evidence
          path: release-source-evidence.json
          if-no-files-found: error

  build:
    needs: prepare
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    # Every target this repository builds, held or not. The publication decision
    # is the heldFromPublication field in shared/release-targets.ts, and it
    # reaches the matrix above through the targets command.
    runs-on: ${{ fromJSON('{"darwin-arm64":"macos-15","darwin-x64":"macos-15-intel","linux-arm64":"ubuntu-24.04-arm","linux-x64":"ubuntu-24.04","windows-x64":"windows-2025"}')[matrix.target] }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install runtime dependencies
        run: npm ci

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Download the release source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source-evidence

      # The compiled executable reports this identity from `--version --json`,
      # and the build refuses to finish if the executable disagrees with it.
      - name: Pin the build identity
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          identity="$(node --import tsx scripts/release-github-assets.ts identity \
            release-source-evidence.json "$TARGET")"
          printf 'AI_1667_BUILD_IDENTITY_JSON=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Build and smoke-test the executable
        working-directory: tui
        run: bun run build:standalone

      # The command writes every file the archive must hold, verifies LICENSE
      # and NOTICE against their reviewed digests, refuses a directory holding
      # anything else, and prints the archive name.
      - name: Assemble and pack the archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/archives
          stem="$(node --import tsx scripts/release-github-assets.ts stage \
            release-source-evidence.json "$TARGET" tui/dist dist/stage)"
          tar -czf "dist/archives/$stem.tar.gz" -C dist/stage "$stem"
          tar -tzf "dist/archives/$stem.tar.gz"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: dist/archives/*.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Only this job signs anything or writes anything: id-token and
      # attestations mint the provenance, contents creates the release.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install runtime dependencies
        run: npm ci

      - name: Download every archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist/assets

      - name: Check that every published target arrived
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$TARGETS" | jq 'length')"
          found="$(find dist/assets -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')"
          if [ "$found" != "$expected" ]; then
            echo "::error::Expected $expected archives, found $found"
            exit 1
          fi

      # The redirection creates checksums.txt before the command reads the
      # directory, which is why the command never lists a file by that name.
      - name: Write checksums.txt
        run: |
          set -euo pipefail
          node --import tsx scripts/release-github-assets.ts checksums dist/assets \
            > dist/assets/checksums.txt
          cat dist/assets/checksums.txt

      - name: Attest every uploaded file
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/assets/*.tar.gz
            dist/assets/checksums.txt

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          node --import tsx scripts/release-github-assets.ts notes "$VERSION" > dist/release-notes.md
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --prerelease \
            --title "1667 v$VERSION" \
            --notes-file dist/release-notes.md \
            dist/assets/*.tar.gz \
            dist/assets/checksums.txt
