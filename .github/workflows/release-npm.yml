name: Release (npm)

# Produces and preflights all release packages. Publication uses npm
# Trusted Publishing. No npm token is stored or accepted.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish without a leading v. The dispatch ref must be the
          v<version> tag. The tag needs no signature: there is no user of this
          product yet, and that protection returns before there is one.
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

# One non-cancelling lock covers all versions. A lock that includes the ref or
# version permits two runs to move the shared next tag at the same time.
concurrency:
  group: ${{ github.triggering_actor == '10fra' && 'release-npm' || format('rejected-release-npm-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false
  queue: max

env:
  NODE_VERSION: 22.22.0
  NPM_VERSION: 11.12.1
  SIGNER_WORKFLOW: 1667-ai/1667/.github/workflows/release-npm.yml

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authorize the release dispatcher
        env:
          DISPATCHER: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$DISPATCHER" = 10fra
          gh_path="$(realpath "$(command -v gh)")"
          if [ ! -f "$gh_path" ] || [ ! -x "$gh_path" ] || [ -L "$gh_path" ]; then
            echo "::error::GitHub CLI is not a regular executable"
            exit 1
          fi
          permission="$(
            "$gh_path" api \
              "repos/$GITHUB_REPOSITORY/collaborators/$DISPATCHER/permission" \
              --jq .permission
          )"
          test "$permission" = admin

  build:
    needs: authorize
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64, windows-x64]
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      # The dispatch ref is the tag, so GITHUB_SHA records the selected commit.
      # The tag ruleset blocks updates and deletions. The publish job checks the
      # exact tag before npm. The release job also checks it.
      # The tag needs no signature — release-evidence.ts still refuses a commit
      # that is not reachable from the protected default branch, which is what
      # keeps an unmerged commit out of a release.
      - name: Refuse a dispatch that is not the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::npm release dispatch must use refs/tags/v$VERSION"
            exit 1
          fi

      - name: Check out the dispatch commit and release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the protected default branch and completion tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch origin '+refs/tags/released/*:refs/tags/released/*'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Pin the hosted GitHub CLI
        run: |
          set -euo pipefail
          posix_gh_path="$(realpath "$(command -v gh)")"
          if [ ! -f "$posix_gh_path" ] || [ ! -x "$posix_gh_path" ] || [ -L "$posix_gh_path" ]; then
            echo "::error::GitHub CLI is not a regular executable"
            exit 1
          fi
          gh_path="$posix_gh_path"
          if [ "$RUNNER_OS" = Windows ]; then
            gh_path="$(cygpath -w "$posix_gh_path")"
          fi
          printf 'RELEASE_GH_PATH=%s\n' "$gh_path" >> "$GITHUB_ENV"

      # This job can mint native provenance. It does not run dependency
      # lifecycle scripts and has no publication environment.
      - name: Install script-free runtime dependencies
        run: npm ci --ignore-scripts

      - name: Install script-free TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify source authority and pin the build identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          timestamp="$(node --import tsx scripts/release-npm-ci.ts timestamp)"
          node --import tsx scripts/release-completion.ts gate "$VERSION" "$GITHUB_SHA"
          node --import tsx scripts/release-evidence.ts \
            --tag "v$VERSION" --build-timestamp "$timestamp" > /dev/null
          identity="$(node --import tsx scripts/release-github-assets.ts identity \
            "$VERSION" "$GITHUB_SHA" "$timestamp" "$TARGET")"
          printf 'AI_1667_BUILD_IDENTITY_JSON=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Refuse a runner that is not the matrix target
        env:
          TARGET: ${{ matrix.target }}
        run: node --import tsx scripts/release-github-assets.ts runner "$TARGET"

      - name: Build and smoke-test the executable
        working-directory: tui
        run: bun run build:standalone

      - name: Observe the native executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable="$(node --import tsx --input-type=module -e '
            import { basename } from "node:path";
            import { releaseTargetForArtifact } from "./shared/release-targets.ts";
            process.stdout.write(basename(releaseTargetForArtifact(process.argv[1]).executable));
          ' "$TARGET")"
          mkdir -p "dist/builds/$TARGET" dist/observations
          cp "tui/dist/$executable" "dist/builds/$TARGET/$executable"
          chmod 0755 "dist/builds/$TARGET/$executable"
          node --import tsx scripts/release-npm-observation.ts \
            "$TARGET" "dist/builds/$TARGET/$executable" > "dist/observations/$TARGET.json"

      - name: Attest the native result before upload
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/builds/${{ matrix.target }}/*
            dist/observations/${{ matrix.target }}.json

      - name: Upload the native result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/builds/${{ matrix.target }}/*
            dist/observations/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90

  launcher:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the dispatch commit and release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the protected default branch and completion tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch origin '+refs/tags/released/*:refs/tags/released/*'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin the hosted GitHub CLI
        run: |
          set -euo pipefail
          gh_path="$(realpath "$(command -v gh)")"
          if [ ! -f "$gh_path" ] || [ ! -x "$gh_path" ] || [ -L "$gh_path" ]; then
            echo "::error::GitHub CLI is not a regular executable"
            exit 1
          fi
          printf 'RELEASE_GH_PATH=%s\n' "$gh_path" >> "$GITHUB_ENV"

      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      # This job can mint attestations. It must not execute dependency scripts.
      - name: Install script-free runtime dependencies
        run: npm ci --ignore-scripts

      - name: Verify source authority
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          timestamp="$(node --import tsx scripts/release-npm-ci.ts timestamp)"
          node --import tsx scripts/release-completion.ts gate "$VERSION" "$GITHUB_SHA"
          node --import tsx scripts/release-evidence.ts \
            --tag "v$VERSION" --build-timestamp "$timestamp" > /dev/null
          printf 'RELEASE_TIMESTAMP=%s\n' "$timestamp" >> "$GITHUB_ENV"

      - name: Download every native result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native

      - name: Verify the native result attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node --import tsx scripts/release-npm-ci.ts
          verify-attestations dist/native 10

      - name: Stage the packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm run --silent release:stage -- \
            "$VERSION" "$GITHUB_SHA" "$RELEASE_TIMESTAMP" \
            dist/native/builds dist/staging \
            > dist/stage.json

      - name: Pack the complete npm matrix
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm run --silent release:pack -- "$VERSION" dist/staging dist/tarballs \
            > dist/pack.json
          mkdir -p dist/observations dist/sboms
          cp dist/native/observations/*.json dist/observations/
          jq -r '.packages[] | [.artifactTarget, .directory] | @tsv' dist/stage.json |
            while IFS=$'\t' read -r target directory; do
              cp "$directory/sbom.spdx.json" "dist/sboms/$target.spdx.json"
            done

      # Native archives use the same executable bytes already built and uploaded
      # by the matrix jobs. This job never rebuilds an executable.
      - name: Stage and pack native Release Archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/archives dist/archive-stage
          targets="$(node --import tsx scripts/release-github-assets.ts targets)"
          printf '%s\n' "$targets" | jq -r '.[]' | while read -r target; do
            stem="$(node --import tsx scripts/release-github-assets.ts stage \
              "$VERSION" "$GITHUB_SHA" "$RELEASE_TIMESTAMP" "$target" \
              "dist/native/builds/$target" dist/archive-stage)"
            # POSIX ustar only: Shell Installer validates the physical stream and
            # refuses PAX/GNU extension headers that default tar formats emit.
            # COPYFILE_DISABLE keeps macOS metadata from adding physical entries.
            COPYFILE_DISABLE=1 tar --format=ustar -czf "dist/archives/$stem.tar.gz" -C dist/archive-stage "$stem"
            tar -tzf "dist/archives/$stem.tar.gz"
          done

      - name: Render channel-specific Installers
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/installers
          digests="$(
            node --import tsx --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readdirSync, readFileSync } from "node:fs";
              const dir = "dist/archives";
              const out = {};
              for (const name of readdirSync(dir)) {
                if (!name.endsWith(".tar.gz")) continue;
                out[name] = createHash("sha256").update(readFileSync(dir + "/" + name)).digest("hex");
              }
              process.stdout.write(JSON.stringify(out));
            '
          )"
          node --import tsx scripts/release-install-script.ts render \
            "$VERSION" "$GITHUB_REPOSITORY" "$digests" dist/installers

      - name: Attest the release packages
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/tarballs/*.tgz
            dist/observations/*.json
            dist/sboms/*.spdx.json
            dist/archives/*.tar.gz
            dist/installers/*

      - name: Upload the release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            dist/tarballs/*.tgz
            dist/observations/*.json
            dist/sboms/*.spdx.json
            dist/archives/*.tar.gz
            dist/installers/*
          if-no-files-found: error
          retention-days: 90

  preflight:
    needs: launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the dispatch commit and release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the protected default branch and completion tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch origin '+refs/tags/released/*:refs/tags/released/*'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin the hosted GitHub CLI
        run: |
          set -euo pipefail
          gh_path="$(realpath "$(command -v gh)")"
          if [ ! -f "$gh_path" ] || [ ! -x "$gh_path" ] || [ -L "$gh_path" ]; then
            echo "::error::GitHub CLI is not a regular executable"
            exit 1
          fi
          printf 'RELEASE_GH_PATH=%s\n' "$gh_path" >> "$GITHUB_ENV"

      - name: Install script-free runtime dependencies
        run: npm ci --ignore-scripts

      - name: Collect source evidence before artifact download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          timestamp="$(node --import tsx scripts/release-npm-ci.ts timestamp)"
          node --import tsx scripts/release-completion.ts gate "$VERSION" "$GITHUB_SHA"
          node --import tsx scripts/release-completion.ts ready
          node --import tsx scripts/release-evidence.ts \
            --tag "v$VERSION" --build-timestamp "$timestamp" \
            > "$RUNNER_TEMP/source-evidence.json"
          chmod 0600 "$RUNNER_TEMP/source-evidence.json"

      - name: Download the release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist/packages

      - name: Verify every package attestation before preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          count="$(node --import tsx --input-type=module -e '
            import { expectedLauncherPackageFileCount } from "./scripts/release-publication-assets.ts";
            process.stdout.write(String(expectedLauncherPackageFileCount(process.env.VERSION)));
          ')"
          found="$(find dist/packages -type f | wc -l | tr -d ' ')"
          if [ "$found" != "$count" ]; then
            echo "::error::Expected $count launcher package files, found $found"
            find dist/packages -type f | sort
            exit 1
          fi
          node --import tsx scripts/release-npm-ci.ts \
            verify-attestations dist/packages "$count"

      - name: Run preflight
        run: |
          set -euo pipefail
          mkdir -p dist/work dist/publication
          node --import tsx scripts/release-npm-plan.ts \
            "$RUNNER_TEMP/source-evidence.json" \
            dist/packages/tarballs \
            dist/packages/observations \
            dist/plan.json
          node --import tsx scripts/release-preflight.ts dist/plan.json \
            > dist/publication/artifact-manifest.json \
            2> dist/work/preflight.log
          digest="$(sed -n 's/^release-manifest-sha256 //p' dist/work/preflight.log)"
          if [ "$(wc -l < dist/work/preflight.log | tr -d ' ')" != 1 ] \
            || [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Preflight did not report one canonical manifest digest"
            exit 1
          fi
          printf '%s  artifact-manifest.json\n' "$digest" \
            > dist/publication/artifact-manifest.sha256
          cp -R dist/packages/tarballs dist/publication/tarballs
          cp -R dist/packages/observations dist/publication/observations
          cp -R dist/packages/sboms dist/publication/sboms
          cp -R dist/packages/archives dist/publication/archives
          cp -R dist/packages/installers dist/publication/installers

      - name: Attest the preflight result
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/publication/artifact-manifest.json
            dist/publication/artifact-manifest.sha256
            dist/publication/tarballs/*.tgz
            dist/publication/observations/*.json
            dist/publication/sboms/*.spdx.json
            dist/publication/archives/*.tar.gz
            dist/publication/installers/*

      - name: Upload the retained publication inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication
          path: dist/publication
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: publish
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
    steps:
      # The dispatch ref is the tag, so GITHUB_SHA records the selected commit.
      # The tag ruleset blocks updates and deletions. This job resolves the tag
      # again before npm publication starts.
      # The tag needs no signature — release-evidence.ts still refuses a commit
      # that is not reachable from the protected default branch, which is what
      # keeps an unmerged commit out of a release.
      - name: Refuse a dispatch that is not the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "::error::npm release dispatch must use refs/tags/v$VERSION"
            exit 1
          fi

      - name: Check out the dispatch commit and release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the protected default branch and completion tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch origin '+refs/tags/released/*:refs/tags/released/*'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin the hosted GitHub CLI
        run: |
          set -euo pipefail
          gh_path="$(realpath "$(command -v gh)")"
          if [ ! -f "$gh_path" ] || [ ! -x "$gh_path" ] || [ -L "$gh_path" ]; then
            echo "::error::GitHub CLI is not a regular executable"
            exit 1
          fi
          printf 'RELEASE_GH_PATH=%s\n' "$gh_path" >> "$GITHUB_ENV"

      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      # This job holds npm OIDC authority. It never runs a dependency script.
      - name: Install script-free runtime dependencies
        run: npm ci --ignore-scripts

      - name: Collect source evidence before artifact download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          timestamp="$(node --import tsx scripts/release-npm-ci.ts timestamp)"
          node --import tsx scripts/release-completion.ts gate "$VERSION" "$GITHUB_SHA"
          node --import tsx scripts/release-completion.ts ready
          node --import tsx scripts/release-evidence.ts \
            --tag "v$VERSION" --build-timestamp "$timestamp" \
            > "$RUNNER_TEMP/source-evidence.json"
          chmod 0600 "$RUNNER_TEMP/source-evidence.json"

      - name: Download the retained publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publication
          path: dist/publication

      - name: Verify every retained input before publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          count="$(node --import tsx --input-type=module -e '
            import { expectedPublicationFileCount } from "./scripts/release-publication-assets.ts";
            process.stdout.write(String(expectedPublicationFileCount(process.env.VERSION)));
          ')"
          found="$(find dist/publication -type f | wc -l | tr -d ' ')"
          if [ "$found" != "$count" ]; then
            echo "::error::Expected $count publication files, found $found"
            find dist/publication -type f | sort
            exit 1
          fi
          node --import tsx scripts/release-npm-ci.ts \
            verify-attestations dist/publication "$count"
          (
            cd dist/publication
            sha256sum -c artifact-manifest.sha256
          )

      - name: Rebuild the preflight plan
        run: |
          set -euo pipefail
          node --import tsx scripts/release-npm-plan.ts \
            "$RUNNER_TEMP/source-evidence.json" \
            dist/publication/tarballs \
            dist/publication/observations \
            dist/plan.json

      - name: Publish platforms, then the launcher
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/tags/released/*:refs/tags/released/*'
          node --import tsx scripts/release-completion.ts gate "$VERSION" "$GITHUB_SHA"
          node --import tsx scripts/release-github-tag.ts \
            verify-tag "$VERSION" "$GITHUB_SHA"
          npm run release:publish -- publish \
            dist/plan.json \
            dist/publication/artifact-manifest.json \
            dist/publication/tarballs

      # This protected tag is the monotonic release record. Create it last.
      - name: Record complete publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          status="$(node --import tsx scripts/release-completion.ts \
            status "$VERSION" "$GITHUB_SHA")"
          if [ "$status" = missing ]; then
            "$RELEASE_GH_PATH" api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/released/v$VERSION" \
              -f sha="$GITHUB_SHA"
          fi

  release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Check out the dispatch commit and release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the protected default branch and completion tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch origin '+refs/tags/released/*:refs/tags/released/*'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin the hosted GitHub CLI
        run: |
          set -euo pipefail
          gh_path="$(realpath "$(command -v gh)")"
          if [ ! -f "$gh_path" ] || [ ! -x "$gh_path" ] || [ -L "$gh_path" ]; then
            echo "::error::GitHub CLI is not a regular executable"
            exit 1
          fi
          printf 'RELEASE_GH_PATH=%s\n' "$gh_path" >> "$GITHUB_ENV"

      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install script-free runtime dependencies
        run: npm ci --ignore-scripts

      - name: Collect source evidence before artifact download
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          timestamp="$(node --import tsx scripts/release-npm-ci.ts timestamp)"
          node --import tsx scripts/release-completion.ts gate "$VERSION" "$GITHUB_SHA"
          node --import tsx scripts/release-completion.ts ready
          node --import tsx scripts/release-evidence.ts \
            --tag "v$VERSION" --build-timestamp "$timestamp" \
            > "$RUNNER_TEMP/source-evidence.json"
          chmod 0600 "$RUNNER_TEMP/source-evidence.json"

      - name: Download the retained publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publication
          path: dist/publication

      - name: Verify every retained input
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          count="$(node --import tsx --input-type=module -e '
            import { expectedPublicationFileCount } from "./scripts/release-publication-assets.ts";
            process.stdout.write(String(expectedPublicationFileCount(process.env.VERSION)));
          ')"
          found="$(find dist/publication -type f | wc -l | tr -d ' ')"
          if [ "$found" != "$count" ]; then
            echo "::error::Expected $count publication files, found $found"
            find dist/publication -type f | sort
            exit 1
          fi
          node --import tsx scripts/release-npm-ci.ts \
            verify-attestations dist/publication "$count"

      - name: Assemble the GitHub release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp dist/publication/tarballs/*.tgz dist/assets/
          cp dist/publication/observations/*.json dist/assets/
          cp dist/publication/sboms/*.spdx.json dist/assets/
          cp dist/publication/archives/*.tar.gz dist/assets/
          cp dist/publication/installers/* dist/assets/
          cp dist/publication/artifact-manifest.json dist/assets/
          cp dist/publication/artifact-manifest.sha256 dist/assets/
          node --import tsx scripts/release-github-assets.ts checksums dist/assets \
            > dist/assets/checksums.txt
          {
            printf '# 1667 v%s\n\n' "$VERSION"
            printf 'This release retains all npm packages and native Release Archives.\n'
            printf 'It also retains the channel-specific Shell and PowerShell Installers.\n\n'
            channel="$(node --import tsx --input-type=module -e '
              import { npmDistTagForVersion } from "./scripts/release-npm-registry.ts";
              process.stdout.write(npmDistTagForVersion(process.argv[1]));
            ' "$VERSION")"
            printf 'npm publication uses the `%s` tag. The version selects it:\n' "$channel"
            printf 'a prerelease publishes to `beta`, and every other version to `latest`.\n'
            printf 'The homepage serves the selected Installers after a separate promotion gate.\n'
          } > dist/release-notes.md

      - name: Publish or verify the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          node --import tsx scripts/release-npm-github.ts
          "$VERSION" "$GITHUB_SHA" dist/assets dist/release-notes.md
