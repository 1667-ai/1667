appId: ai.1667.desktop
productName: "1667"
executableName: "1667"
directories:
  # Keep the generated app tree under the desktop project root. The builder
  # otherwise detects desktop/app as a two-package layout and expects an
  # index.js entry in that directory.
  app: .
  output: dist/raw
  buildResources: build
files:
  - app/**
  - package.json
asar: true
asarUnpack:
  - node_modules/**/*.node
  - node_modules/**/*.wasm
  - app/**/*.wasm
nodeGypRebuild: false
# The native modules ship Node-API prebuilds. Check them under Electron;
# rebuilding msgpackr-extract unnecessarily selects its optional V8 API.
npmRebuild: false
mac:
  category: public.app-category.productivity
  # The afterPack hook signs private releases with an anonymous identity.
  identity: null
  forceCodeSigning: false
  # The builder template grants ad-hoc runtime library access.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
afterPack: ./scripts/sign-mac-adhoc.mjs
dmg:
  # DMG does not need an updater blockmap.
  writeUpdateInfo: false
win:
  target:
    - nsis
  artifactName: 1667-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
linux:
  category: Office
  syncDesktopName: true
  target:
    - AppImage
  artifactName: 1667-${version}-${arch}.${ext}
publish:
  provider: generic
  url: https://1667.ai/electron-updater/
