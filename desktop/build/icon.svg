  <text x="470" y="520" fill="#FFFFFF"
        font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="560" font-weight="700" text-anchor="middle" dominant-baseline="central">¶</text>
</svg>
